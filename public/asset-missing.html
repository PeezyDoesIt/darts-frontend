<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asset not found</title>
<!--
  Deliberately self-contained — no stylesheet, no script, nothing under /assets. This page
  answers a missing build asset, so anything it referenced could be missing too.

  Also deliberately not named 404.html: Cloudflare Pages adopts a root 404.html as its
  built-in not-found page for every unmatched path, which overrides the SPA rewrite and
  breaks every client-side route.
-->
<style>
  body {
    margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center;
    background: #0a0a0a; color: #f4f4f5; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: 48px; letter-spacing: 0.08em; }
  p { margin: 0; color: rgba(255, 255, 255, 0.55); font-size: 15px; line-height: 1.6; }
  a { color: #ff2d78; font-weight: 700; text-decoration: none; margin-top: 8px; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>404</h1>
  <p>That file isn't here.<br />If the app looked blank a moment ago, a hard refresh should sort it.</p>
  <a href="/">Back to the scoreboard</a>
</body>
</html>
