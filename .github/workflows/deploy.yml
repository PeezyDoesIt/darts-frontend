name: CI

# Runs on pull requests as well as pushes to main, so a broken change is caught before it
# merges rather than after. The deploy job is gated to main pushes — a pull request runs
# every check but must never ship.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Cheapest checks first, so a typo fails in a minute rather than after a browser
      # download. Nothing used to gate this deploy at all — a red suite still shipped.
      - run: npm run test:unit

      # `build` is `vue-tsc && vite build`, so this is the typecheck as well as the bundle.
      #
      # Vite inlines import.meta.env.VITE_* at BUILD time, and the build runs here — the
      # Pages project has no Git connection, so Cloudflare only receives an already-built
      # dist/. A variable set in the Pages dashboard would be a runtime value for Functions
      # and would never reach this bundle. .env.production is gitignored, so without this
      # the variable is simply undefined in every deployed build.
      # Public config, not a secret: this host is already in the API's CORS allowlist.
      - run: npm run build
        env:
          VITE_API_URL: https://api.peezydoesit.net

      # The unit suite covers scoring and bot logic as pure functions. These are the only
      # tests that check a game still boots and can be played in a browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Hand the tested bundle to the deploy job rather than rebuilding it there, so what
      # ships is the exact artifact these checks ran against.
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # `_redirects` is Cloudflare-specific — vite dev and vite preview both ignore it — so SPA
  # fallback and asset serving are only real once deployed. Giving every pull request its own
  # throwaway Pages deployment is the only way to check that layer before production sees it.
  # Adding a root 404.html once silently overrode the SPA catch-all and 404'd every
  # client-side route; nothing in CI could have caught it, because nothing was deployed.
  preview:
    needs: test
    # Forked pull requests get no secrets, so the deploy would fail rather than be skipped.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Any branch other than the project's production branch deploys as a preview, on its
      # own hostname. Production is untouched.
      - name: Deploy preview to Cloudflare Pages
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c3d520e44678d984986f2145363abe64
          command: pages deploy dist --project-name=darts-frontend --branch=${{ github.head_ref }}

      - name: Check routing on the preview
        run: node scripts/check-routing.mjs "${{ steps.preview.outputs.deployment-url }}"

      - name: Comment the preview URL on the pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- pages-preview -->'
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}\n\n`
              + 'Routing checks passed against this deployment — SPA deep links serve the app '
              + 'shell, and every referenced asset serves with its real content type.'
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
              .data.find(c => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c3d520e44678d984986f2145363abe64
          command: pages deploy dist --project-name=darts-frontend --branch=main

      # Production is already live by this point, so this cannot prevent a bad deploy — but a
      # red build beats finding out from a user that every deep link 404s.
      - name: Check routing on production
        run: node scripts/check-routing.mjs https://peezydoesit.net
