name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Nothing used to gate this deploy — a red test suite still shipped. The unit tests
      # cover scoring and bot logic; the smoke tests are the only thing that checks a game
      # still boots and can be played in a browser, which is how UI breakage reached prod.
      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Vite inlines import.meta.env.VITE_* at BUILD time, and the build runs here — the
      # Pages project has no Git connection, so Cloudflare only receives an already-built
      # dist/. A variable set in the Pages dashboard would be a runtime value for Functions
      # and would never reach this bundle. .env.production is gitignored, so without this
      # the variable is simply undefined in every deployed build.
      # Public config, not a secret: this host is already in the API's CORS allowlist.
      - run: npm run build
        env:
          VITE_API_URL: https://api.peezydoesit.net

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c3d520e44678d984986f2145363abe64
          command: pages deploy dist --project-name=darts-frontend --branch=main
